<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06140f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Prayer Times</title>
<style>
:root{--bg:#06140f;--card:#0d2a20;--line:#1f4d3b;--gold:#e3c26a;--fg:#f2efe4;--dim:#8fb5a3}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#06140f;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;color:var(--fg);font-family:"Noto Naskh Arabic","Noto Sans Arabic","DejaVu Sans",system-ui,sans-serif}
#stage{width:54rem;height:96rem;background:var(--bg);padding:2.5rem;display:grid;grid-template-columns:29rem 1fr;gap:2rem}
.col{display:flex;flex-direction:column;gap:2rem;min-height:0}
.card{background:var(--card);border:.15rem solid var(--line);border-radius:1.6rem;padding:1.6rem}
#clock{text-align:center;padding:1.4rem 1rem}
#time{font-size:9.2rem;font-weight:700;line-height:1;letter-spacing:-.2rem;font-variant-numeric:tabular-nums}
#subrow{display:flex;justify-content:space-between;align-items:center;margin-top:.4rem;padding:0 .6rem}
#sub{font-size:2.2rem;color:var(--dim)}
#moon{display:flex;align-items:center;gap:.7rem;text-align:left;font-size:1.3rem;color:var(--dim);line-height:1.3}
#moon svg{width:4.4rem;height:4.4rem;flex:none}
#sub b{color:var(--gold);font-weight:600}
#hdate{margin-top:1.2rem;font-size:3.4rem;color:var(--gold);line-height:1.3}
#hdate small{display:block;font-size:2rem;color:var(--fg)}
#gdate{font-size:1.9rem;color:var(--dim);margin-top:.4rem}
#cal{flex:1;min-height:0;display:flex;flex-direction:column}
#chead{text-align:center;margin-bottom:1rem}
#chead .ar{font-size:3.4rem;color:var(--gold);line-height:1.2}
#chead .en{font-size:1.8rem;color:var(--dim)}
#grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;align-content:center}
.dn{text-align:center;font-size:1.1rem;color:var(--dim);padding-bottom:.4rem}
.d{height:4.2rem;border-radius:.8rem;text-align:center;padding-top:.3rem;background:rgba(255,255,255,.03)}
.d .h{font-size:2.1rem;font-weight:600;line-height:1.15}
.d .g{font-size:1rem;color:var(--dim)}
.d.today{background:var(--gold);color:#12201a}.d.today .g{color:#12201a}
.d.fri .h{color:var(--gold)}.d.today.fri .h{color:#12201a}
#wx{display:flex;flex-direction:column;justify-content:center;height:13rem;gap:.3rem}
#wx .city{font-size:1.6rem;color:var(--dim)}
#wx{cursor:pointer}
#wx .t{font-size:5.2rem;font-weight:700;line-height:1}
#wx .c{font-size:2rem}
#pr{display:flex;flex-direction:column;gap:1.4rem}
.p{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:1.2rem 1.3rem}
.p .ar{font-size:3rem;line-height:1.2;color:var(--gold)}
.p .en{font-size:1.4rem;color:var(--dim);letter-spacing:.1rem;margin-bottom:.7rem}
.p .r{display:flex;justify-content:space-between;align-items:baseline;width:100%}
.p .r span{font-size:1.2rem;color:var(--dim);letter-spacing:.1rem}
.p .r b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.p .r b{font-size:3.1rem}
.p .az b{color:var(--fg)}
.p .nm{margin-top:.2rem}.p .nm b{color:var(--gold)}
.p .r b small{font-size:1.1rem;font-weight:500;margin-left:.25rem;color:var(--dim)}
.p.done{opacity:.45}
.p.next{background:var(--gold);border-color:var(--gold);color:#12201a}
.p.next .ar,.p.next .en,.p.next .r span,.p.next .r b,.p.next .r b small{color:#12201a}
#eid{display:none;margin-top:1rem;background:var(--gold);color:#12201a;border-radius:1rem;font-size:1.7rem;font-weight:700;padding:.5rem .6rem}
</style></head><body>
<div id="stage">
 <div class="col">
  <div class="card" id="clock">
   <div id="time">--:--</div>
   <div id="subrow"><div id="sub"></div><div id="moon"></div></div>
   <div id="hdate"></div>
   <div id="eid"></div>
   <div id="gdate"></div>
  </div>
  <div class="card" id="cal"><div id="chead"></div><div id="grid"></div></div>
  <div class="card" id="wx"><div class="city"></div><div class="t">--</div><div class="c"></div></div>
 </div>
 <div class="col" id="pr"></div>
</div>
<script>
// ---- settings (the admin page will edit these later) ----
const CFG={city:'Bengaluru',lat:12.9716,lon:77.5946,
  asrFactor:1,        // 1 = Shafi/Maliki/Hanbali, 2 = Hanafi
  hijriAdjust:0,      // moon-sighting correction in days (-2..+2)
  offsets:{fajr:0,dhuhr:0,asr:0,maghrib:0,isha:0},
  // namaz (jamaat) times: 'after' = minutes after azan, 'at' = fixed clock time (24h)
  namaz:{fajr:{after:15},dhuhr:{at:'13:00'},asr:{at:'16:00'},maghrib:{after:5},isha:{at:'20:00'}},
  jumuah:'13:00',   // replaces Dhuhr namaz on Fridays
  eid:'08:30'};    // Eid namaz, shown on 1 Shawwal and 10 Dhul Hijjah // minutes added to calculated azan times
try{const l=JSON.parse(localStorage.getItem('loc'));if(l){CFG.lat=l.lat;CFG.lon=l.lon;CFG.city=l.city}}catch(e){}
const NAMES=[['fajr','الفجر','FAJR'],['dhuhr','الظهر','DHUHR'],['asr','العصر','ASR'],['maghrib','المغرب','MAGHRIB'],['isha','العشاء','ISHA']];

// ---- azan times: astronomical calculation, works offline (Karachi: Fajr/Isha 18°) ----
const rad=Math.PI/180,sin=a=>Math.sin(a*rad),cos=a=>Math.cos(a*rad),tan=a=>Math.tan(a*rad);
const fix=(a,b)=>{a-=b*Math.floor(a/b);return a<0?a+b:a};
function prayers(date){
  const tz=-date.getTimezoneOffset()/60;
  const jd=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/864e5+2440587.5-CFG.lon/360;
  const D=jd-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360);
  const L=fix(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-3.6e-7*D;
  const RA=fix(Math.atan2(cos(e)*sin(L),cos(L))/rad,360)/15;
  const eqt=fix(q/15-RA+12,24)-12,dec=Math.asin(sin(e)*sin(L))/rad;
  const noon=12-eqt-CFG.lon/15+tz,lat=CFG.lat;
  const at=(ang,ccw)=>{const t=Math.acos((-sin(ang)-sin(lat)*sin(dec))/(cos(lat)*cos(dec)))/rad/15;return noon+(ccw?-t:t)};
  const asrAng=-Math.atan(1/(CFG.asrFactor+tan(Math.abs(lat-dec))))/rad;
  const h={fajr:at(18,1),dhuhr:noon+.0,asr:at(asrAng,0),maghrib:at(.833,0),isha:at(18,0)};
  const day=new Date(date.getFullYear(),date.getMonth(),date.getDate()),out={};
  for(const k in h)out[k]=new Date(day.getTime()+Math.round(h[k]*60+CFG.offsets[k])*6e4);
  return out;
}
// ---- Hijri (Umm al-Qura via browser Intl) ----
const adj=d=>new Date(d.getTime()+CFG.hijriAdjust*864e5);
const hparts=d=>{const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(adj(d));const g=t=>+p.find(x=>x.type===t).value;return{d:g('day'),m:g('month'),y:g('year')}};
const hName=(d,loc)=>new Intl.DateTimeFormat(loc+'-u-ca-islamic-umalqura-nu-latn',{month:'long'}).format(adj(d));
const noonOf=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);
const fmt=d=>{let h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';h=h%12||12;return[h+':'+String(m).padStart(2,'0'),ap]};
const $=s=>document.querySelector(s);

// ---- moon phase & distance (low-precision astronomical series, offline) ----
function moon(now){
  const T=(now/864e5+2440587.5-2451545)/36525;
  const D=fix(297.8502+445267.1115*T,360),M=fix(357.5291+35999.0503*T,360),Mp=fix(134.9634+477198.8676*T,360),F=fix(93.272+483202.0175*T,360);
  const lm=fix(218.3165+481267.8813*T+6.289*sin(Mp)+1.274*sin(2*D-Mp)+.658*sin(2*D)+.214*sin(2*Mp)-.186*sin(M)-.114*sin(2*F),360);
  const ls=fix(280.4665+36000.7698*T+1.915*sin(M)+.02*sin(2*M),360);
  const dist=385001-20905*cos(Mp)-3699*cos(2*D-Mp)-2956*cos(2*D)-570*cos(2*Mp);
  const psi=fix(lm-ls,360),wax=psi<180,e=wax?psi:360-psi;
  return{k:(1-cos(e))/2,wax,e,dist,age:psi/360*29.53};
}
function drawMoon(now){
  const m=moon(now),R=19*384400/m.dist,a=R*cos(m.e),ax=Math.abs(a).toFixed(2);   // disc size follows real distance
  const lit='M0 '+-R+' A'+R+' '+R+' 0 0 1 0 '+R+' A'+ax+' '+R+' 0 0 '+(a>0?0:1)+' 0 '+-R+'Z';
  $('#moon').innerHTML='<svg viewBox="-22 -22 44 44"><circle r="'+R+'" fill="#24352e" stroke="#4d6b5e" stroke-width=".6"/><path d="'+lit+'" fill="#f3ecc8"'+(m.wax?'':' transform="scale(-1,1)"')+'/></svg>'+
    '<div>'+Math.round(m.k*100)+'% lit<br>'+(m.wax?'Waxing':'Waning')+' · day '+Math.round(m.age)+'</div>';
}
function drawCalendar(now){
  const t=noonOf(now),h=hparts(t),first=new Date(t.getTime()-(h.d-1)*864e5);
  let len=h.d;for(let k=h.d;k<31;k++){if(hparts(new Date(first.getTime()+k*864e5)).m!==h.m)break;len=k+1}
  $('#chead').innerHTML='<div class="ar">'+hName(t,'ar')+' '+h.y+'</div><div class="en">'+hName(t,'en')+' '+h.y+' AH</div>';
  const dn=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],de=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  let s=dn.map((a,i)=>'<div class="dn">'+a+'<br>'+de[i]+'</div>').join('');
  for(let i=0;i<first.getDay();i++)s+='<div></div>';
  for(let d=1;d<=len;d++){const gd=new Date(first.getTime()+(d-1)*864e5),dow=gd.getDay();
    s+='<div class="d'+(d===h.d?' today':'')+(dow===5?' fri':'')+'"><div class="h">'+d+'</div><div class="g">'+gd.getDate()+'</div></div>'}
  $('#grid').innerHTML=s;
}
const clockAt=(d,hm)=>{const[h,m]=hm.split(':');return new Date(d.getFullYear(),d.getMonth(),d.getDate(),+h,+m)};
function namazTimes(date,az){
  const o={};
  for(const k in CFG.namaz){const c=CFG.namaz[k];o[k]=c.after!=null?new Date(az[k].getTime()+c.after*6e4):clockAt(date,c.at)}
  if(date.getDay()===5)o.dhuhr=clockAt(date,CFG.jumuah);
  return o;
}
function drawPrayers(now){
  const az=prayers(now),nm=namazTimes(now,az),fri=now.getDay()===5;
  let next=NAMES.findIndex(n=>nm[n[0]]>now);
  const wrap=next<0;
  if(wrap){const t=new Date(now.getTime()+864e5),a2=prayers(t);next=0;az.fajr=a2.fajr;nm.fajr=namazTimes(t,a2).fajr}
  $('#pr').innerHTML=NAMES.map((n,i)=>{
    const jum=fri&&n[0]==='dhuhr',[at,aa]=fmt(az[n[0]]),[nt,na]=fmt(nm[n[0]]);
    return'<div class="card p'+(i===next?' next':(wrap||i<next)?' done':'')+'"><div class="ar">'+(jum?'الجمعة':n[1])+'</div><div class="en">'+(jum?"JUMU\u2019AH":n[2])+
      '</div><div class="r az"><span>AZAN</span><b>'+at+'<small>'+aa+'</small></b></div><div class="r nm"><span>'+(jum?'JUMU\u2019AH':'NAMAZ')+'</span><b>'+nt+'<small>'+na+'</small></b></div></div>'}).join('');
}
let lastMin='',lastDay='';
function tick(){
  const now=new Date(),[tm,ap]=fmt(now);
  $('#time').textContent=tm;$('#sub').innerHTML='<b>'+ap+'</b> · '+String(now.getSeconds()).padStart(2,'0')+'s';
  const mk=now.getHours()+':'+now.getMinutes(),dk=now.toDateString();
  if(dk!==lastDay){lastDay=dk;const h=hparts(noonOf(now));
    $('#hdate').innerHTML=h.d+' '+hName(noonOf(now),'ar')+'<small>'+hName(noonOf(now),'en')+' '+h.y+' AH</small>';
    $('#gdate').textContent=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const eidDay=(h.m===10&&h.d===1)||(h.m===12&&h.d===10),eb=$('#eid');
    if(eidDay){const[et,ea]=fmt(clockAt(now,CFG.eid));eb.style.display='block';eb.textContent='عيد مبارك · EID NAMAZ '+et+' '+ea}else eb.style.display='none';
    drawCalendar(now)}
  if(mk!==lastMin){lastMin=mk;drawPrayers(now);drawMoon(now)}
}
// ---- weather (Open-Meteo, no key). Keeps last good reading if offline ----
const WC={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
function showWx(w){$('#wx .city').textContent=CFG.city+(matchMedia('(pointer:coarse)').matches?' · tap to use my location':'');$('#wx .t').textContent=Math.round(w.t)+'°C';$('#wx .c').textContent=(WC[w.c]||'')+' · Humidity '+w.h+'%'}
async function weather(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+CFG.lat+'&longitude='+CFG.lon+'&current=temperature_2m,relative_humidity_2m,weather_code&timezone=auto');
    const j=(await r.json()).current,w={t:j.temperature_2m,h:j.relative_humidity_2m,c:j.weather_code};
    showWx(w);try{localStorage.setItem('wx',JSON.stringify(w))}catch(e){}
  }catch(e){try{const w=JSON.parse(localStorage.getItem('wx'));if(w)showWx(w);else $('#wx .city').textContent=CFG.city+' · weather unavailable'}catch(_){}}
}
function fit(){const r=Math.min(innerWidth/54,innerHeight/96);document.documentElement.style.fontSize=r+'px';$('#stage').style.height=Math.max(96,innerHeight/r)+'rem'}
$('#wx').addEventListener('click',()=>{
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(p=>{
    CFG.lat=+p.coords.latitude.toFixed(4);CFG.lon=+p.coords.longitude.toFixed(4);CFG.city='My location';
    try{localStorage.setItem('loc',JSON.stringify({lat:CFG.lat,lon:CFG.lon,city:CFG.city}))}catch(e){}
    lastMin='';tick();weather()},()=>{},{timeout:10000})});
// keep the screen on when opened as .../index.html?awake (for a tablet used as a masjid display)
if(/[?&]awake/.test(location.search)&&'wakeLock' in navigator){const lock=()=>navigator.wakeLock.request('screen').catch(()=>{});lock();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock()})}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('resize',fit);fit();tick();setInterval(tick,1000);weather();setInterval(weather,18e5);
</script></body></html>
